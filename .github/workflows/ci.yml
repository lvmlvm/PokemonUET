name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (with ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
      - name: Build
        run: |
          cmake -S . -B build -DPOKEMON_SANITIZE=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2 sdl2_image sdl2_ttf sdl2_mixer
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC + vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: vcpkg install sdl2 sdl2-image sdl2-ttf "sdl2-mixer[mpg123]" --triplet x64-windows
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
